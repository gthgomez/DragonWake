name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Combat tests (T3–T4)
        run: pnpm --filter @tideforge/combat test
      - name: Server tests (memory path; PG skipped honestly)
        run: pnpm --filter @tideforge/server test
      - name: Web build + typecheck
        run: pnpm --filter @tideforge/web build
      - name: Server typecheck
        run: pnpm --filter @tideforge/server typecheck
