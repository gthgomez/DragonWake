services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tideforge
      POSTGRES_PASSWORD: tideforge
      POSTGRES_DB: tideforge
    ports:
      - "5432:5432"
    volumes:
      - tideforge_pg:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tideforge -d tideforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - .:/app
    command: bash -lc "corepack enable && pnpm install && pnpm --filter @tideforge/server start"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://tideforge:tideforge@db:5432/tideforge
      DEV_FAST_TIME: "1"
      DEV_SKIP_TUTORIAL: "1"
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - .:/app
    command: bash -lc "corepack enable && pnpm install && pnpm --filter @tideforge/web exec vite --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  tideforge_pg:
