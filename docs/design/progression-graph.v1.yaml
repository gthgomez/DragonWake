historical_chain:
  original_outposts:
    confidence: high_for_sequence
    contamination_risk: medium
    sequence:
      - Water Outpost
      - Stone Outpost
      - Fire Outpost
      - Wind Outpost
    preserve: chained_differentiated_expansion
    reject:
      - elemental_taxonomy_as_tideforge_canon
      - exact_egg_drop_rules_as_immutable

invariants:
  - id: PG-INV-001
    statement: Economy feeds military capability.
  - id: PG-INV-002
    statement: Population/manpower is mechanically meaningful and legible.
  - id: PG-INV-003
    statement: Research unlocks strategy, not only percentage inflation.
  - id: PG-INV-004
    statement: March size, concurrency and command capacity are progression axes.
  - id: PG-INV-005
    statement: World PvE feeds progression with non-menu-earned value.
  - id: PG-INV-006
    statement: Wilderness ownership has persistent value outside PvP.
  - id: PG-INV-007
    statement: Primary-dragon readiness is a composite multi-system gate.
  - id: PG-INV-008
    statement: First specialized settlement is earned through world activity.
  - id: PG-INV-009
    statement: Secondary settlements grant differentiated strategic capabilities.
  - id: PG-INV-010
    statement: Dragons do not erase armies, logistics, fortifications or commanders.
  - id: PG-INV-011
    statement: Individual progression eventually creates alliance interdependence.

non_invariants:
  - elemental_water_stone_fire_wind_theme
  - exact_resource_names_or_ratios
  - exact_building_levels_or_timers
  - exact_original_troop_roster
  - exact_general_star_formula
  - zero_tax_training_exploit
  - one_construction_queue
  - mandatory_dragon_in_every_egg_hunt_march
  - exact_camp_respawn_or_drop_rates
  - stackable_true_dragons
  - power_score_dominance
  - paid_instant_movement
